<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Hàn Giai — luyện chữ Hán kiểu Duolingo</title>
<meta name="description" content="Luyện chữ Hán HSK 1–3: pinyin → chữ Hán, nghe, ghép chữ, ôn tập thông minh."/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="css/hanyu.css"/>
</head>
<body>
<div class="bgchars" aria-hidden="true"><span class="han">学</span><span class="han">语</span><span class="han">汉</span></div>

<div id="app">
  <div id="loading">Đang tải dữ liệu từ vựng…</div>

  <!-- ===== MÀN HỌC (LỘ TRÌNH) ===== -->
  <section id="scr-home" class="hidden">
    <header class="topbar">
      <div class="brand"><span class="seal han">汉</span>Hàn Giai</div>
      <div class="topstats">
        <div class="pill flame" id="hStreak"><i data-lucide="flame"></i><span>0</span></div>
        <div class="pill zap" id="hXp"><i data-lucide="zap"></i><span>0</span></div>
        <button class="pill iconbtn" id="btnSound" title="Bật / tắt âm thanh"><i data-lucide="volume-2"></i></button>
      </div>
    </header>
    <div class="greet" id="greet"></div>
    <div id="revcard"></div>
    <main id="path"></main>
  </section>

  <!-- ===== SỔ TAY TỪ VỰNG ===== -->
  <section id="scr-vocab" class="hidden">
    <div class="scrhead">
      <h1>Sổ tay từ vựng</h1>
      <div class="searchbox">
        <i data-lucide="search"></i>
        <input id="vsearch" type="text" placeholder="Tìm theo chữ, pinyin hoặc nghĩa…"/>
      </div>
    </div>
    <div class="chips" id="vchips"></div>
    <div id="vlist"></div>
  </section>

  <!-- ===== HỒ SƠ ===== -->
  <section id="scr-profile" class="hidden"></section>

  <nav class="tabbar">
    <button class="tab on" data-scr="scr-home"><i data-lucide="map"></i>Học</button>
    <button class="tab" data-scr="scr-vocab"><i data-lucide="book-open"></i>Từ vựng</button>
    <button class="tab" data-scr="scr-profile"><i data-lucide="user"></i>Hồ sơ</button>
  </nav>

  <!-- ===== OVERLAY BÀI HỌC ===== -->
  <section id="lesson" class="hidden">
    <div class="lhead">
      <button class="xbtn" id="lClose"><i data-lucide="x"></i></button>
      <div class="pbar"><div class="pfill" id="pfill"></div></div>
      <div class="combo" id="lCombo"><i data-lucide="flame"></i><span>×3</span></div>
      <div class="hearts" id="lHearts"><i data-lucide="heart"></i><span>5</span></div>
    </div>
    <div class="lbody" id="lbody"></div>
    <div class="lfoot hidden" id="lfoot"></div>
    <div class="sheet hidden" id="sheet"></div>
  </section>
</div>

<div id="modal-root"></div>
<div id="toast"></div>
<canvas id="fx"></canvas>

<script src="script/hanyu.js" defer></script>
</body>
</html>
